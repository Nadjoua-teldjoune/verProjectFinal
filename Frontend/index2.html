  // Dynamic Screen Size Detection
  const BREAKPOINTS = {
        sm: 480,
        md: 768,
        lg: 1024,
        xl: 1200,
        xxl:1600
      };

      function updateDynamicClasses() {
        const width = window.innerWidth;
        const body = document.body;
        
        // Remove all dynamic classes first
        body.classList.remove(
          'dynamic-sm-screen',
          'dynamic-md-screen',
          'dynamic-lg-screen',
          'dynamic-xl-screen',      
              'dynamic-xsl-screen',
          'dynamic-xxl-screen'
        );
        
        // Add appropriate class based on current width
        if (width <= BREAKPOINTS.sm) {
          body.classList.add('dynamic-sm-screen');
        } else if (width <= BREAKPOINTS.md) {
          body.classList.add('dynamic-md-screen');
        } else if (width <= BREAKPOINTS.lg) {
          body.classList.add('dynamic-lg-screen');
        } else if (width < BREAKPOINTS.xsl) {
          body.classList.add('dynamic-xsl-screen');
        } else if (width <= BREAKPOINTS.xl) {
          body.classList.add('dynamic-xl-screen');
          
        } else if  (width > BREAKPOINTS.xl)
        body.classList.add('dynamic-xxl-screen');
        // Update CSS variable
        document.documentElement.style.setProperty('--current-screen-width', `${width}px`);
      }

      // Initialize and set up event listener
      window.addEventListener('DOMContentLoaded', () => {
        updateDynamicClasses();
        window.addEventListener('resize', updateDynamicClasses);
      });

      function uploadFile() {
    const fileInput = document.getElementById("file-input");
    const codeDisplay = document.getElementById("code"); // Zone d'affichage du fichier
    const guideLink = "help.html"; // Remplacez par votre vrai lien

    if (fileInput.files.length === 0) {
        alert("❌ Veuillez sélectionner un fichier à charger.");
        return;
    }

    const file = fileInput.files[0];
    if (!file.name.endsWith(".txt")) {
        alert("❌ Erreur : seul un fichier au format .txt est accepté.");
        window.location.href = guideLink; // Redirection vers help.html
        return;
    }
    const reader = new FileReader();

    reader.onload = function (event) {
        const fileContent = event.target.result; // Contenu du fichier
        
        // Vérification du format
        const isValidFormat = fileContent.split('\n').some(line => {
            return line.match(/^CALLER:.+,METHOD:.+,CALLEE:.+$/);
        });

        if (!isValidFormat) {
            if (confirm(`❌ Erreur : la syntaxe de la trace est incorrecte.\n\nChaque ligne doit être au format :\nCALLER:NomClasse,METHOD:NomMéthode,CALLEE:NomClasse\n\nVoulez-vous consulter la page d'aide pour plus d'informations ?`)) {
                window.location.href = guideLink; // Redirection vers help.html
            }
            return;
        }
        codeDisplay.textContent = fileContent; // Affichage dans <pre id="code">
        
        // Appeler la fonction de coloration après un léger délai pour s'assurer que le DOM est mis à jour
        setTimeout(() => {
            if (typeof highlightKeywords === 'function') {
                highlightKeywords();
            }
        }, 10);
    };

    reader.readAsText(file); // Lire le fichier en tant que texte
}



       function insererTrace(texte) {
    let traceDisplay = document.getElementById("code");
    if (traceDisplay) {
        traceDisplay.innerHTML = texte
            .replace(/CALLER:/g, "<span style='color: cyan; background: transparent;'>CALLER:</span>")
            .replace(/METHOD:/g, "<span style='color: pink; background: transparent;'>METHOD:</span>")
            .replace(/CALLEE:/g, "<span style='color: orange; background: transparent;'>CALLEE:</span>");
    }
}

function toggleButtons() {
  const buttonsContainer = document.querySelector(".buttons-container1");
  const toggleIcon = document.querySelector(".toggle-btn i");

  if (buttonsContainer.style.display === "none" || buttonsContainer.style.display === "") {
    buttonsContainer.style.display = "flex"; // Show the buttons
    toggleIcon.classList.remove("fa-plus"); // Remove "+" icon
    toggleIcon.classList.add("fa-minus"); // Add "-" icon
  } else {
    buttonsContainer.style.display = "none"; // Hide the buttons
    toggleIcon.classList.remove("fa-minus"); // Remove "-" icon
    toggleIcon.classList.add("fa-plus"); // Add "+" icon
  }
}

    const analyzeButton = document.getElementById("analyze-button");

function runFunction() {
    const fileInput = document.getElementById("file-input");
    const outputFrame = document.getElementById("output-frame");

    // Vérifier si un fichier est sélectionné
    if (fileInput.files.length === 0) {
        alert("❌ Veuillez sélectionner un fichier de trace.");
        return;
    }

    // Vérifier si une tactique est sélectionnée
    if (!selectedTactic) {
        alert("❌ Aucune tactique sélectionnée ! Veuillez en choisir une avant de continuer.");
        return;
    }

    const file = fileInput.files[0];

    // Vérifier le type de fichier
    if (!file.type.includes("text")) {
        alert("❌ Veuillez sélectionner un fichier texte.");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {
        const traceText = event.target.result.trim(); // Contenu du fichier
        const lines = traceText.split(/\r?\n/); // Découpe en lignes

        // Expression régulière pour la syntaxe attendue
        const syntaxRegex = /^CALLER:.+,METHOD:.+,CALLEE:.+$/;

        // Vérifier que chaque ligne respecte la syntaxe
        const invalidLines = lines.filter(line => !syntaxRegex.test(line));

        const outputDocument = outputFrame.contentDocument || outputFrame.contentWindow.document;

        if (invalidLines.length > 0) {
            // Si des lignes invalides, afficher un message d'erreur
            outputDocument.body.innerHTML = `
                <p style="color: red;">❌ Erreur de syntaxe détectée !</p>
                <p>Chaque ligne doit respecter la forme : <code>CALLER:...,METHOD:...,CALLEE:...</code></p>
                <p>Exemple de ligne incorrecte détectée :</p>
                <pre style="color: black; background: #ffe6e6; padding: 10px;">${escapeHTML(invalidLines[0])}</pre>
                
            `;
       
            
                window.location.href = guideLink; // Redirection vers help.html
                return;
            }
         
        

        // Afficher un indicateur de chargement
        outputDocument.body.innerHTML = `<p style="color: blue;">⏳ Analyse en cours...</p>`;

        // Si tout est correct, envoyer au serveur
        fetch("http://localhost:3000/run-parser", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                trace: traceText,
                tactic: selectedTactic
            })
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => { throw new Error(err.result); });
            }
            return response.json();
        })
        .then(data => {
            outputDocument.body.innerHTML = `<pre style="font-size: 14px; color: white; background: black; padding: 10px;">${escapeHTML(data.result)}</pre>`;
        })
        .catch(error => {
            console.error("Erreur :", error);
            outputDocument.body.innerHTML = `<p style="color: red;">❌ ${escapeHTML(error.message)}</p>`;
        });
    };

    reader.readAsText(file);
}

// Fonction pour échapper le HTML
function escapeHTML(str) {
    return str.replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
}

app.post("/run-parser", (req, res) => {
    const { tactic, trace } = req.body;

    if (!tactic || !trace) {
        return res.status(400).json({ error: "Tactique ou trace manquante." });
    }

    let parserCommand = "";

    switch (tactic) {
        case "Maintain Copies":
            parserCommand = "javac MaintainMultipleCopiesParser.java && java MaintainMultipleCopiesParser";
            break;
        case "Authorize User": 
            parserCommand = "javac AuthorizeUserTactic1.java && java AuthorizeUserTactic1";
            break;
        case "Maintain Confidentiality":
            parserCommand = "javac MaintainDataConfidentialityParser.java && java MaintainDataConfidentialityParser";
            break;
        case "Ping Echo":
            parserCommand = "javac PingEchoParser.java && java PingEchoParser";
            break;
        case "Onetime Password":
            parserCommand = "javac OneTimePasswordParser.java && java OneTimePasswordParser";
            break;
        case "ID/Password & Maintain Confidentiality":
            parserCommand = "javac IDPassMaintainConfParser.java && java IDPassMaintainConfParser";
            break;
        default:
            return res.status(400).json({ error: "Tactique inconnue." });
    }


    console.log(`Exécution de la commande : ${parserCommand}`);

    const process = exec(parserCommand, (error, stdout, stderr) => {
        if (error) {
            console.error(`Erreur d'exécution : ${stderr}`);
            return res.status(500).json({ error: stderr });
        }
        console.log(`Résultat du parser : ${stdout}`);
        res.json({ result: stdout });
    });

    // 🔹 Envoi de la trace au programme Java
    console.log("Trace envoyée :", trace);
    process.stdin.write(trace + "\n");
    process.stdin.end();
});

class TraceAnalyzer {
  static async analyze(trace, tactic) {
    const response = await fetch('http://localhost:3000/run-parser', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ trace, tactic })

      throw new Error(error.message || 'Analysis failed');
    }
    
    return response.json();
  }
}

/**
 * Generates AI-powered security trace pattern suggestions
 * @param {string} tactic - The security tactic to generate a trace for
 * @param {number} [count=3] - Number of trace examples to generate
 * @returns {Promise<Array<string>>} - Array of generated trace patterns
 */
 async function getAITraceSuggestion(tactic, count = 3) {
  // Validate input
  if (!tactic || typeof tactic !== 'string') {
    throw new Error('Invalid tactic provided');
  }

  const validTactics = [
    'Maintain Copies',
    'Authorize User',
    'Maintain Confidentiality',
    'Ping Echo',
    'One-time Password',
    'ID/Password & Maintain Confidentiality'
  ];

  if (!validTactics.includes(tactic)) {
    throw new Error(`Unsupported tactic. Valid options are: ${validTactics.join(', ')}`);
  }

  // Construct the AI prompt
  const prompt = `
    You are a security software expert. Generate ${count} diverse and realistic examples 
    of security trace patterns for the "${tactic}" tactic. Each trace should follow this exact format:
    CALLER:ClassName,METHOD:methodName,CALLEE:ClassName
    
    Include 3-5 method calls that demonstrate the tactic in action.
    Use realistic class and method names that would appear in enterprise software.
    Separate each complete trace example with "====".
    
    For ${tactic}, focus on these key aspects:
    ${getTacticSpecificGuidance(tactic)}
  `;

  try {
    // Call OpenAI API (or your preferred AI service)
    const response = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`
      },
      body: JSON.stringify({
        model: 'gpt-4',
        messages: [{
          role: 'system',
          content: 'You are a security trace pattern specialist. Generate accurate, technical trace examples.'
        }, {
          role: 'user',
          content: prompt
        }],
        temperature: 0.7,
        max_tokens: 1000
      })
    });

    if (!response.ok) {
      throw new Error(`AI API error: ${response.statusText}`);
    }

    const data = await response.json();
    const content = data.choices[0]?.message?.content;
    
    if (!content) {
      throw new Error('No content received from AI');
    }

    // Process the response into clean trace patterns
    return processAIResponse(content);
  } catch (error) {
    console.error('AI suggestion failed:', error);
    // Fallback to default patterns
    return getDefaultPatterns(tactic, count);
  }
}

// Helper function to add tactic-specific guidance
function getTacticSpecificGuidance(tactic) {
  const guidance = {
    'Maintain Copies': `Focus on replication methods like copy(), sync(), replicate(). 
      Include primary and backup storage interactions.`,
    'Authorize User': `Show authentication flows with methods like authenticate(), 
      verifyCredentials(), checkAccess().`,
    'Maintain Confidentiality': `Highlight encryption/decryption with methods like encryptData(), 
      decrypt(), secureTransmit().`,
    'Ping Echo': `Demonstrate health checking with ping(), echo(), checkStatus(), 
      and fault handling methods.`,
    'One-time Password': `Show OTP generation, validation with generateOTP(), 
      validateOTP(), expireToken().`,
    'ID/Password & Maintain Confidentiality': `Combine authentication and encryption 
      with methods like encryptCredentials(), verifySecureAuth().`
  };
  
  return guidance[tactic] || 'Demonstrate the security pattern with realistic method calls.';
}

// Process the AI response into clean trace arrays
function processAIResponse(content) {
  return content
    .split('====')
    .map(trace => trace.trim())
    .filter(trace => trace.length > 0)
    .map(trace => {
      // Remove any commentary or non-trace lines
      return trace.split('\n')
        .filter(line => line.startsWith('CALLER:'))
        .join('\n');
    });
}

// Fallback default patterns
function getDefaultPatterns(tactic, count) {
  const defaults = {
    'Maintain Copies': [
      `CALLER:DataManager,METHOD:replicateData,CALLEE:PrimaryStorage\n` +
      `CALLER:DataManager,METHOD:copyToBackup,CALLEE:BackupStorage\n` +
      `CALLER:BackupStorage,METHOD:verifyCopy,CALLEE:DataManager`,
      
      `CALLER:DatabaseSync,METHOD:syncRecords,CALLEE:MainDatabase\n` +
      `CALLER:DatabaseSync,METHOD:updateReplica,CALLEE:ReplicaDatabase\n` +
      `CALLER:ReplicaDatabase,METHOD:acknowledgeSync,CALLEE:DatabaseSync`
    ],
    // ... other default patterns
  };
  
  return defaults[tactic]?.slice(0, count) || [];
}

function compilerTrace() {
  const editor = document.getElementById("code");
  const text = editor.innerText.trim();
  const guideLink = "help.html";

  if (text === "" || text === "Écrivez votre trace ici") {
    alert("❌ Veuillez écrire ou charger une trace.");
    return;
  }

  const lines = text.split("\n");
  const allValid = lines.every(line => {
    return line.trim() === "" || /^CALLER:.+,METHOD:.+,CALLEE:.+$/.test(line.trim());
  });

  if (!allValid) {
    const showHelp = confirm(`❌ Erreur : la syntaxe de la trace est incorrecte.\n\nChaque ligne doit être au format :\nCALLER:NomClasse,METHOD:NomMéthode,CALLEE:NomClasse\n\nVoulez-vous consulter la page d'aide ?`);
    if (showHelp) {
      window.location.href = guideLink;
    }
    return;
  }

  alert("✅ Compilation réussie !");
}

let downloadCount = 1;

async function downloadResult() {
  const outputFrame = document.getElementById("output-frame");
  const resultText = outputFrame?.contentWindow?.document?.body?.innerText?.trim();

  if (!resultText || resultText === "") {
    alert("❌ Aucun résultat à télécharger. Veuillez d'abord exécuter une analyse.");
    return;
  }

  let customName = prompt("📝 Entrez le nom du fichier PDF (sans extension) :", "");
  if (customName) {
    customName = customName.trim().replace(/[^a-zA-Z0-9_\-]/g, "_");
  }
  if (!customName) {
    customName = `analysis_result_${downloadCount}`;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const margin = 15;
  let y = margin;

  // 🎯 Titre
  const title = selectedTactic ? `Résultat d'analyse — Tactique : ${selectedTactic}` : "Résultat d'analyse";
  doc.setFont("helvetica", "bold");
  doc.setFontSize(14);
  doc.setTextColor(33, 37, 41);
  doc.text(title, margin, y);

  // Ligne
  doc.setDrawColor(70, 130, 180);
  doc.setLineWidth(0.8);
  doc.line(margin, y + 5, 210 - margin, y + 5);

  y += 15;

  // 📆 Date
  const today = new Date().toLocaleString("fr-FR");
  doc.setFontSize(11);
  doc.setFont("helvetica", "normal");
  doc.setTextColor(60);
  doc.setFillColor(240, 240, 240);
  doc.rect(margin, y - 6, 100, 8, "F");
  doc.text(`Date d'analyse : ${today}`, margin + 2, y);
  y += 10;

  // 📌 Nom de la tactique détectée (dans le contenu)
  if (selectedTactic) {
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.setTextColor(0, 102, 204);
    doc.text(`Tactique détectée : ${selectedTactic}`, margin, y);
    y += 10;
  }

  // 📋 Résultat
  doc.setFont("courier", "normal");
  doc.setFontSize(10);
  doc.setTextColor(20);
  const lines = doc.splitTextToSize(resultText, 180);
  const lineHeight = 6;
  const pageHeight = 297;

  for (let line of lines) {
    if (y > pageHeight - 20) {
      doc.addPage();
      y = margin;
    }
    doc.text(line, margin, y);
    y += lineHeight;
  }

  doc.save(`${customName}.pdf`);
  showNotification(`✅ PDF généré avec succès : ${customName}.pdf`);
  downloadCount++;
}

function showNotification(message) {
  const notification = document.createElement("div");
  notification.innerHTML = `<i class="fas fa-check-circle" style="margin-right: 8px;"></i>${message}`;
  Object.assign(notification.style, {
    position: "fixed",
    bottom: "30px",
    right: "30px",
    background: "#198754",
    color: "white",
    padding: "14px 24px",
    borderRadius: "12px",
    fontSize: "16px",
    fontWeight: "bold",
    fontFamily: "Arial, sans-serif",
    boxShadow: "0px 4px 12px rgba(0, 0, 0, 0.25)",
    zIndex: 9999,
    opacity: "0",
    transition: "opacity 0.4s ease"
  });

  document.body.appendChild(notification);
  setTimeout(() => notification.style.opacity = "1", 100);
  setTimeout(() => {
    notification.style.opacity = "0";
    setTimeout(() => document.body.removeChild(notification), 500);
  }, 4000);
}
function enregistrerTrace(trace) {
        let historique =
          JSON.parse(localStorage.getItem("historiqueTraces")) || [];

        // Ajouter la date et l'heure actuelle
        let now = new Date();
        let timestamp = now.toLocaleString(); // Format lisible (ex: "01/03/2025, 14:30:45")

        // Création d'un objet contenant la trace et son horodatage
        let traceAvecDate = {
          date: timestamp,
          contenu: trace,
        };

        // Ajouter la nouvelle trace au début de l'historique
        historique.unshift(traceAvecDate);

        // Garder seulement les 3 dernières traces
        if (historique.length > 3) {
          historique.pop();
        }

        // Sauvegarder l'historique mis à jour dans localStorage
        localStorage.setItem("historiqueTraces", JSON.stringify(historique));
      }
