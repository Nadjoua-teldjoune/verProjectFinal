<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Tactic - TacticCC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="dark-mode">
 
    

   
        <div class="form-container">
            <h1 class="form-title">Add New Tactic</h1>
            <form id="add-tactic-form" class="tactic-form">
                <div class="form-group">
                    <label for="tactic-name">Tactic Name</label>
                    <input type="text" id="tactic-name" name="tactic-name" placeholder="Enter tactic name" required>
                </div>
                <div class="form-group">
                    <label for="tactic-description">Description</label>
                    <textarea id="tactic-description" name="tactic-description" placeholder="Enter a brief description" required></textarea>
                </div>
                <div class="form-group">
                    <label for="tactic-code">JavaCC Code</label>
                    <textarea id="tactic-code" name="tactic-code" placeholder="Paste your JavaCC code here" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-save">Save Tactic</button>
                    <button type="button" class="btn-cancel" onclick="window.location.href='dashboard.html'">Cancel</button>
                </div>
            </form>
        </div>
   

    <script src="script2.js"></script>
</body>
</html>
