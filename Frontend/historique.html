<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique des Traces</title>
    <style>
        /* Dark Mode Styling */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #E0E0E0;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: #1E1E1E;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        h1, h2 {
            color: #e3b70a;
        }

        .trace-container {
            background: #2A2A2A;
            padding: 15px;
            border-radius: 6px;
            border-left: 5px solid #03DAC6;
            margin: 10px 0;
            white-space: pre-wrap;
            font-family: "Courier New", monospace;
            overflow-x: auto;
        }

        .clear-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
            text-align: center;
        }

        .clear-btn:hover {
            background-color: darkred;
        }

        /* Button Styling */
        .back-btn {
            display: inline-block;
            padding: 10px 15px;
            margin-top: 20px;
            background-color: #BB86FC;
            color: #121212;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .back-btn:hover {
            background-color: #9A67EA;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>📜 Historique des Traces</h1>
        <p>Cette page affiche les 3 dernières traces exécutées.</p>
        
        <div id="historique"></div>
        
        <button class="clear-btn" onclick="effacerHistorique()">Effacer l'historique</button>
        <button class="back-btn" onclick="goBack()">← Retour</button>
    </div>

    <script>
        
        function afficherHistorique() {
    let historique = JSON.parse(localStorage.getItem("historiqueTraces")) || [];
    let container = document.getElementById("historique");
    container.innerHTML = "";

    if (historique.length === 0) {
        container.innerHTML = "<p>Aucune trace enregistrée.</p>";
    } else {
        historique.forEach(item => {
            let div = document.createElement("div");
            div.className = "trace-container";
            div.innerHTML = `<strong>📅 ${item.date}</strong><br><pre>${item.contenu}</pre>`;
            container.appendChild(div);
        });
    }
}


        function effacerHistorique() {
            localStorage.removeItem("historiqueTraces");
            afficherHistorique();
        }

        function goBack() {
            window.history.back();
        }

        afficherHistorique();
    </script>

</body>
</html>
